name: Deploy to Azure Web App

on:
  push:
    branches:
      - main # Se ejecuta cada vez que subís algo a la rama main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'sede-milicic' # El nombre de tu App Service en Azure
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          clean: true # Borra lo viejo en Azure antes de subir lo nuevo
